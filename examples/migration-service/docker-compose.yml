# MongoDB + Redis for the example, and a Jaeger for the optional tracing. The MongoDB is the Atlas
# local image — a single-node replica set with mongot, so the declared search index in
# collections/plans.js converges too (connect with directConnection=true, see .env.example). It
# takes about a minute to report healthy. A plain `mongo:7` works as well with
# MIGRONAUT_ON_SEARCH_UNAVAILABLE=skip: everything but the search index converges.
services:
  mongo:
    image: mongodb/mongodb-atlas-local:8.0
    environment:
      DO_NOT_TRACK: '1'
    ports:
      - '127.0.0.1:27017:27017'
  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:6379:6379'
    # BullMQ needs keys to stay put: never evict.
    command: ['redis-server', '--maxmemory-policy', 'noeviction']
  # Optional — only used when OTEL_EXPORTER_OTLP_ENDPOINT is set (see .env.example).
  # Takes OTLP over HTTP on 4318 and serves the trace UI on 16686.
  jaeger:
    image: jaegertracing/jaeger:2.21.0
    ports:
      - '127.0.0.1:4318:4318'
      - '127.0.0.1:16686:16686'
