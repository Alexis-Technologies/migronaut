# MongoDB + Redis for the example. A standalone MongoDB is enough here; switch
# to a replica set only if your migrations use `useTransaction: true`.
services:
  mongo:
    image: mongo:7
    ports:
      - '127.0.0.1:27017:27017'
  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:6379:6379'
    # BullMQ needs keys to stay put: never evict.
    command: ['redis-server', '--maxmemory-policy', 'noeviction']
