name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default: nothing here writes to the repository.
permissions:
  contents: read

# A new push to the same branch supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The integration tests download a MongoDB binary; cache it across runs and
  # pin the version so the whole suite always runs against the same server.
  MONGOMS_VERSION: 7.0.14
  MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb-binaries

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      # Smoke: keeps the bundle-size script working and its numbers visible in CI logs.
      - run: pnpm size

  types:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:types
      # Compiles index.d.ts on its own — the hand-written type surface has no
      # other compiler pass over it.
      - run: pnpm run check:dts

  # The engines floor (>=22.18) and Windows path handling both need real
  # coverage; the unit suite is what runs everywhere, since
  # mongodb-memory-server's replica-set startup is slow on Windows.
  unit:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:unit

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: Cache the MongoDB binary
        uses: actions/cache@v4
        with:
          path: ${{ env.MONGOMS_DOWNLOAD_DIR }}
          key: mongodb-${{ runner.os }}-${{ env.MONGOMS_VERSION }}
      - run: pnpm install --frozen-lockfile
      # Runs the integration tests serially (see the test:coverage script):
      # each boots its own replica set, and running them concurrently collides
      # on ports and starves the timing-sensitive lock tests.
      - run: pnpm run test:coverage
      - name: Upload coverage
        if: matrix.node-version == 22
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 14

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A broken docs build should fail the PR, not the deploy that follows it.
      - run: pnpm run docs:build

  # Single aggregate check for branch protection: require only "ci-success"
  # instead of naming every matrix leg (which silently un-requires new legs).
  ci-success:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint, types, unit, test, docs]
    if: always()
    steps:
      - name: Fail when any needed job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All CI jobs passed"
