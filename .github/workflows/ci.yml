name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      # Smoke: keeps the bundle-size script working and its numbers visible in CI logs.
      - run: pnpm size

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # mongodb-memory-server's replica-set startup is the practical floor here,
        # not the test runner — node:test itself works on the package's >=18 engines floor.
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:coverage
      - run: pnpm run test:types
